name: jobhunter-ai

services:
  db:
    image: postgres:17-bookworm@sha256:639ab7ceb90e13123085b741fb31ef493fba25463002f6da665352e7b534b652
    environment:
      POSTGRES_DB: ${JOBHUNTER_DB_NAME:-jobhunter}
      POSTGRES_USER: ${JOBHUNTER_DB_USER:-jobhunter}
      POSTGRES_PASSWORD: ${JOBHUNTER_DB_PASSWORD:?Run python scripts/init_env.py first}
    ports:
      - "127.0.0.1:${JOBHUNTER_DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
    command: ["python", "-m", "jobhunter_api.manage", "provision"]
    environment:
      JOBHUNTER_DB_HOST: db
      JOBHUNTER_DB_PORT: "5432"
      JOBHUNTER_DB_NAME: ${JOBHUNTER_DB_NAME:-jobhunter}
      JOBHUNTER_DB_USER: ${JOBHUNTER_DB_USER:-jobhunter}
      JOBHUNTER_DB_PASSWORD: ${JOBHUNTER_DB_PASSWORD:?Run python scripts/init_env.py first}
      JOBHUNTER_APP_DB_USER: ${JOBHUNTER_APP_DB_USER:-jobhunter_app}
      JOBHUNTER_APP_DB_PASSWORD: ${JOBHUNTER_APP_DB_PASSWORD:?Run python scripts/init_env.py first}
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: ./apps/api
    environment:
      JOBHUNTER_DB_HOST: db
      JOBHUNTER_DB_PORT: "5432"
      JOBHUNTER_DB_NAME: ${JOBHUNTER_DB_NAME:-jobhunter}
      JOBHUNTER_DB_USER: ${JOBHUNTER_APP_DB_USER:-jobhunter_app}
      JOBHUNTER_DB_PASSWORD: ${JOBHUNTER_APP_DB_PASSWORD:?Run python scripts/init_env.py first}
      JOBHUNTER_ALLOWED_ORIGINS: '["http://127.0.0.1:${WEB_PORT:-5173}","http://localhost:${WEB_PORT:-5173}"]'
      JOBHUNTER_OPENAI_API_KEY: ${JOBHUNTER_OPENAI_API_KEY:-}
      JOBHUNTER_GMAIL_CLIENT_ID: ${JOBHUNTER_GMAIL_CLIENT_ID:-}
      JOBHUNTER_GMAIL_CLIENT_SECRET: ${JOBHUNTER_GMAIL_CLIENT_SECRET:-}
      JOBHUNTER_GMAIL_REDIRECT_URI: ${JOBHUNTER_GMAIL_REDIRECT_URI:-http://127.0.0.1:5173/}
      JOBHUNTER_DISCOVERY_ENCRYPTION_KEY: ${JOBHUNTER_DISCOVERY_ENCRYPTION_KEY:-}
      JOBHUNTER_AI_MODEL: ${JOBHUNTER_AI_MODEL:-gpt-4.1-mini-2025-04-14}
      JOBHUNTER_AI_CV_MODEL: ${JOBHUNTER_AI_CV_MODEL:-gpt-4.1-mini-2025-04-14}
      JOBHUNTER_AI_PARSING_MODEL: ${JOBHUNTER_AI_PARSING_MODEL:-gpt-4.1-mini-2025-04-14}
      JOBHUNTER_AI_MATCHING_MODEL: ${JOBHUNTER_AI_MATCHING_MODEL:-gpt-5.6-luna}
      JOBHUNTER_AI_STRATEGY_MODEL: ${JOBHUNTER_AI_STRATEGY_MODEL:-gpt-4.1-mini-2025-04-14}
      JOBHUNTER_AI_REVIEW_MODEL: ${JOBHUNTER_AI_REVIEW_MODEL:-gpt-5.6-luna}
      JOBHUNTER_AI_RESEARCH_MODEL: ${JOBHUNTER_AI_RESEARCH_MODEL:-gpt-5.6-luna}
      JOBHUNTER_AI_CV_EFFORT: ${JOBHUNTER_AI_CV_EFFORT:-high}
      JOBHUNTER_AI_PARSING_EFFORT: ${JOBHUNTER_AI_PARSING_EFFORT:-high}
      JOBHUNTER_AI_MATCHING_EFFORT: ${JOBHUNTER_AI_MATCHING_EFFORT:-high}
      JOBHUNTER_AI_STRATEGY_EFFORT: ${JOBHUNTER_AI_STRATEGY_EFFORT:-high}
      JOBHUNTER_AI_REVIEW_EFFORT: ${JOBHUNTER_AI_REVIEW_EFFORT:-high}
      JOBHUNTER_AI_RESEARCH_EFFORT: ${JOBHUNTER_AI_RESEARCH_EFFORT:-high}
      JOBHUNTER_AI_CV_PROMPT_SUFFIX: ${JOBHUNTER_AI_CV_PROMPT_SUFFIX:-}
      JOBHUNTER_AI_PARSING_PROMPT_SUFFIX: ${JOBHUNTER_AI_PARSING_PROMPT_SUFFIX:-}
      JOBHUNTER_AI_MATCHING_PROMPT_SUFFIX: ${JOBHUNTER_AI_MATCHING_PROMPT_SUFFIX:-}
      JOBHUNTER_AI_STRATEGY_PROMPT_SUFFIX: ${JOBHUNTER_AI_STRATEGY_PROMPT_SUFFIX:-}
      JOBHUNTER_AI_REVIEW_PROMPT_SUFFIX: ${JOBHUNTER_AI_REVIEW_PROMPT_SUFFIX:-}
      JOBHUNTER_AI_RESEARCH_PROMPT_SUFFIX: ${JOBHUNTER_AI_RESEARCH_PROMPT_SUFFIX:-}
      JOBHUNTER_AI_MAX_OUTPUT_TOKENS: ${JOBHUNTER_AI_MAX_OUTPUT_TOKENS:-8000}
      JOBHUNTER_AI_TIMEOUT_SECONDS: ${JOBHUNTER_AI_TIMEOUT_SECONDS:-180}
      JOBHUNTER_AI_MONTHLY_EUR: ${JOBHUNTER_AI_MONTHLY_EUR:-10}
      JOBHUNTER_COMBINED_MONTHLY_EUR: ${JOBHUNTER_COMBINED_MONTHLY_EUR:-25}
      JOBHUNTER_AI_EUR_PER_USD: ${JOBHUNTER_AI_EUR_PER_USD:-1.25}
      JOBHUNTER_AI_PRICES_REVIEWED: ${JOBHUNTER_AI_PRICES_REVIEWED:-2026-09-20}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)"]
      interval: 5s
      timeout: 6s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  discovery:
    build:
      context: ./apps/api
    command: ["python", "-m", "jobhunter_api.discovery_worker"]
    environment:
      JOBHUNTER_DB_HOST: db
      JOBHUNTER_DB_PORT: "5432"
      JOBHUNTER_DB_NAME: ${JOBHUNTER_DB_NAME:-jobhunter}
      JOBHUNTER_DB_USER: ${JOBHUNTER_APP_DB_USER:-jobhunter_app}
      JOBHUNTER_DB_PASSWORD: ${JOBHUNTER_APP_DB_PASSWORD:?Run python scripts/init_env.py first}
      JOBHUNTER_GMAIL_CLIENT_ID: ${JOBHUNTER_GMAIL_CLIENT_ID:-}
      JOBHUNTER_GMAIL_CLIENT_SECRET: ${JOBHUNTER_GMAIL_CLIENT_SECRET:-}
      JOBHUNTER_GMAIL_REDIRECT_URI: ${JOBHUNTER_GMAIL_REDIRECT_URI:-http://127.0.0.1:5173/}
      JOBHUNTER_DISCOVERY_ENCRYPTION_KEY: ${JOBHUNTER_DISCOVERY_ENCRYPTION_KEY:-}
      JOBHUNTER_ALLOWED_ORIGINS: '["http://127.0.0.1:${WEB_PORT:-5173}","http://localhost:${WEB_PORT:-5173}"]'
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped

volumes:
  postgres_data:
