name: Local application and AI contracts

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: jobhunter
          POSTGRES_PASSWORD: ci-synthetic-only
          POSTGRES_DB: jobhunter
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U jobhunter"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      JOBHUNTER_DB_PASSWORD: ci-synthetic-only
      JOBHUNTER_TEST_DB_NAME: jobhunter_test_ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.7'
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --locked
      - run: uv run --locked ruff check . ../../scripts/init_env.py ../../scripts/smoke_local.py ../../scripts/evaluate_phase1.py ../../scripts/evaluate_phase2.py ../../scripts/configure_openai.py
      - run: uv run --locked ruff format --check . ../../scripts/init_env.py ../../scripts/smoke_local.py ../../scripts/evaluate_phase1.py ../../scripts/evaluate_phase2.py ../../scripts/configure_openai.py
      - run: uv run --locked mypy
      - run: uv run --locked pytest
      - run: uv run --locked python ../../scripts/evaluate_phase1.py --check
      - run: uv run --locked python ../../scripts/evaluate_phase2.py --check
      - run: uv build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python scripts/init_env.py
      - run: docker compose config --quiet
      - run: docker compose up --build --detach --wait --wait-timeout 120
      - run: python scripts/smoke_local.py --exercise-db-recovery
      - if: failure()
        run: docker compose logs --no-color --tail 80
      - if: always()
        run: docker compose down --volumes

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.12.7'
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python scripts/init_env.py
      - run: docker compose up --detach --wait db
      - run: uv sync --project apps/api --locked
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
      - if: always()
        run: docker compose down --volumes

  design-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-phase0.txt
      - run: python scripts/validate_phase0.py
