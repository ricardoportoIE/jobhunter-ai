[project]
name = "jobhunter-api"
version = "0.1.0"
description = "Local API for JobHunter AI"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.7,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.34,<1",
  "argon2-cffi>=25.1,<26",
  "openai>=2,<3",
  "python-docx>=1.2,<2",
  "reportlab>=4.4,<5",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pypdf>=6,<7",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "types-reportlab>=5.0.0.20260911",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["jobhunter_api"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
